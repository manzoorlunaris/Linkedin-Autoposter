{% extends "base.html" %}
{% block title %}Sign up — Signal Desk{% endblock %}
{% block content %}
<style>
  body { margin: 0; background: #10131a; color: #e9e6dc; font-family: "Inter", sans-serif; }
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: #1e2330; border: 1px solid #2a2f3d; border-radius: 10px; padding: 28px; }
  .login-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .login-mark { font-size: 26px; color: #e8a33d; line-height: 1; }
  .login-brand h1 { font-family: "Space Grotesk", sans-serif; font-size: 20px; font-weight: 600; margin: 0; }
  .login-sub { margin: 2px 0 0; font-size: 13px; color: #8a90a3; }
  .login-card form { display: flex; flex-direction: column; gap: 14px; }
  .login-card label { font-size: 12px; color: #8a90a3; display: flex; flex-direction: column; gap: 6px; }
  .login-card input[type="text"], .login-card input[type="password"] {
    background: #10131a; border: 1px solid #2a2f3d; border-radius: 6px;
    padding: 9px 10px; color: #e9e6dc; font-family: "Inter", sans-serif; font-size: 14px;
  }
  .login-card input:focus { outline: 2px solid #e8a33d; outline-offset: 1px; }
  .login-error { background: rgba(226,104,95,0.1); border: 1px solid rgba(226,104,95,0.3); color: #e2685f; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin: 2px 0 0; }
  .login-hint { font-size: 11px; color: #565c6d; margin: 2px 0 0; }
  .login-btn { font-family: "Inter", sans-serif; font-size: 13px; font-weight: 600; border-radius: 7px; padding: 10px 16px; border: 1px solid transparent; cursor: pointer; background: #e8a33d; color: #1a1305; margin-top: 6px; }
  .login-btn:hover { background: #f0b055; }
  .login-footer { margin-top: 18px; font-size: 12px; color: #8a90a3; text-align: center; }
  .login-footer a { color: #e8a33d; text-decoration: none; }
  .login-footer a:hover { text-decoration: underline; }
</style>

<div class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-mark">◈</span>
      <div>
        <h1>Signal Desk</h1>
        <p class="login-sub">Create your console login</p>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      <label>Username
        <input type="text" name="username" value="{{ form.username.value|default:'' }}" autofocus required>
        {% for error in form.username.errors %}<span class="login-error">{{ error }}</span>{% endfor %}
      </label>
      <label>Password
        <input type="password" name="password1" required>
        <span class="login-hint">At least 8 characters, not too common or all-numeric.</span>
        {% for error in form.password1.errors %}<span class="login-error">{{ error }}</span>{% endfor %}
      </label>
      <label>Confirm password
        <input type="password" name="password2" required>
        {% for error in form.password2.errors %}<span class="login-error">{{ error }}</span>{% endfor %}
      </label>
      <button type="submit" class="login-btn">Create account</button>
    </form>

    <p class="login-footer">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
  </div>
</div>
{% endblock %}
